<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fb">
  <title>Team settings · Let's Game</title>
  <link rel="stylesheet" href="app.css">
  <script src="core.js" defer></script>
  <script src="settings.js" defer></script>
</head>
<body class="settings-page">
  <div class="app-shell settings-shell">
    <header class="topbar">
      <a class="brand" href="game.html" aria-label="Let's Game, view game">
        <span class="brand-mark" aria-hidden="true">🎉</span>
        <span>let's <strong>game</strong></span>
      </a>
      <span class="topbar-note">Get your teams ready</span>
    </header>

    <main>
      <div class="settings-reset-row">
        <button id="resetButton" class="button button-danger" type="button">
          <span aria-hidden="true">↺</span> Reset settings
        </button>
      </div>

      <section class="page-heading">
        <p class="eyebrow">BEFORE YOU PLAY</p>
        <h1>Teams</h1>
        <p class="intro-copy">Build your dream team: give it a name, a smile, and a colour.</p>
      </section>

      <section class="team-editor-section" aria-labelledby="teamSectionTitle">
        <div class="section-heading">
          <div>
            <h2 id="teamSectionTitle">Your game</h2>
            <p class="section-subtitle"><span id="teamCount">0 teams</span> · your choices are saved on this device</p>
          </div>
          <button id="addTeamButton" class="button button-secondary" type="button">
            <span aria-hidden="true">＋</span> Add a team
          </button>
        </div>

        <div id="teamsList" class="team-editor-list" aria-live="polite"></div>
      </section>

      <div class="settings-footer">
        <p id="saveStatus" class="save-status" role="status" aria-live="polite"></p>
        <div class="settings-actions">
          <button id="saveButton" class="button button-secondary" type="button">Save settings</button>
          <button id="startButton" class="button button-primary" type="button">
            Start a new game <span aria-hidden="true">→</span>
          </button>
        </div>
      </div>
    </main>

    <footer class="site-footer">Simple, cheerful, and ready to play.</footer>
  </div>
</body>
</html>
