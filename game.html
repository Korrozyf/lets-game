<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fb">
  <title>The Game · Let's Game</title>
  <link rel="stylesheet" href="app.css">
  <script src="core.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body class="game-page">
  <div class="app-shell game-shell">
    <header class="topbar">
      <a class="brand" href="game.html" aria-label="Let's Game, current game">
        <span class="brand-mark" aria-hidden="true">🎉</span>
        <span>let's <strong>game</strong></span>
      </a>
      <a class="button button-icon settings-link" href="settings.html" aria-label="Open team settings" title="Team settings">
        <span aria-hidden="true">⚙</span><span class="settings-link-label">Settings</span>
      </a>
    </header>

    <main>
      <section class="game-heading">
        <p class="eyebrow">LET'S PLAY</p>
        <h1>The game is on <span aria-hidden="true">✨</span></h1>
        <p class="intro-copy">Keep score and cheer on your favourite team.</p>
      </section>

      <section id="teamsGrid" class="teams-grid" aria-label="Teams and scores"></section>
      <section id="emptyGame" class="empty-state" hidden>
        <span class="empty-emoji" aria-hidden="true">👋</span>
        <h2>No teams yet</h2>
        <p>Add at least one team to start the game.</p>
        <a class="button button-primary" href="settings.html">Set up teams</a>
      </section>

      <div class="game-footer">
        <p class="game-hint"><span aria-hidden="true">💡</span> Scores can go below zero.</p>
        <button id="finishButton" class="button button-primary finish-button" type="button">
          Finish game <span aria-hidden="true">🏆</span>
        </button>
      </div>
    </main>

    <footer class="site-footer">Every point counts. Even negative points.</footer>
  </div>
</body>
</html>
