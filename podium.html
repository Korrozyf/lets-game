<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fb">
  <title>The Podium · Let's Game</title>
  <link rel="stylesheet" href="app.css">
  <script src="core.js" defer></script>
  <script src="podium.js" defer></script>
</head>
<body class="podium-page">
  <div class="app-shell podium-shell">
    <header class="topbar">
      <a class="brand" href="game.html" aria-label="Let's Game, view game">
        <span class="brand-mark" aria-hidden="true">🎉</span>
        <span>let's <strong>game</strong></span>
      </a>
      <a class="button button-icon settings-link" href="settings.html" aria-label="Open team settings" title="Team settings">
        <span aria-hidden="true">⚙</span><span class="settings-link-label">Settings</span>
      </a>
    </header>

    <main>
      <section class="podium-heading">
        <p class="eyebrow">GAME OVER</p>
        <h1>Congratulations to all teams!</h1>
        <p class="intro-copy">Here are the top three scores from the game.</p>
      </section>

      <section id="podium" class="podium" aria-label="Team podium"></section>
      <p class="tie-note"><span aria-hidden="true">🤝</span> Tied teams share the same podium place.</p>

      <div class="podium-actions">
        <a class="button button-secondary" href="game.html">← View scores</a>
        <button id="replayButton" class="button button-primary" type="button">Play again <span aria-hidden="true">↻</span></button>
      </div>
    </main>

    <footer class="site-footer">See you soon for a rematch!</footer>
  </div>
</body>
</html>
